connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/
fs.native-s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=admin
s3.aws-secret-key=password
# The maintenance service keeps 1 h of snapshots (SNAPSHOT_RETENTION); Trino refuses anything below
# these minimums (default 7 d). 10 min still dwarfs Flink's 10 s checkpoints, so files Flink has
# written but not committed yet are never taken for orphans.
iceberg.expire-snapshots.min-retention=10m
iceberg.remove-orphan-files.min-retention=10m
